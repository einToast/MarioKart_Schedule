name: Test Python Webserver

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
    webserver-test:
        name: webserver-test (${{ matrix.arch }})
        strategy:
          fail-fast: false
          matrix:
            include:
              - arch: amd64
                runner: ubuntu-24.04
              - arch: arm64
                runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}

        steps:
        - uses: actions/checkout@v7

        - name: Set up Python 3.14
          uses: actions/setup-python@v7
          with:
            python-version: '3.14'
            cache: 'pip'
            cache-dependency-path: requirements.txt

        - name: Install dependencies
          run: |
            python -m pip install --only-binary :all: -r requirements.txt

        - name: Start Webserver in Background
          run: |
            nohup python src/webserver.py > webserver.log 2>&1 & echo $! > server.pid

        - name: Wait for Webserver to become healthy
          run: |
            curl --fail --silent --show-error \
                 --retry 15 --retry-delay 2 --retry-connrefused \
                 http://localhost:8000/healthcheck

        - name: Test Webserver
          run: |
            curl -f http://localhost:8000/healthcheck

        - name: Show server logs on failure
          if: failure()
          run: |
            echo "--- webserver.log (tail) ---" && tail -n 200 webserver.log || true

        - name: Stop Webserver
          if: always()
          run: |
            if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
