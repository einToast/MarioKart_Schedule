name: Update pip requirements

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    name: Update requirements.txt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Update lockfile
        run: pip-compile --upgrade --generate-hashes --output-file=requirements.txt --strip-extras requirements.in

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(deps): update pip requirements"
          title: "chore(deps): update pip requirements"
          body: |
            Monthly refresh of pip dependencies.
            Generated using `pip-compile --upgrade --generate-hashes`.
          branch: automation/pip-requirements-update
          add-paths: requirements.txt
          delete-branch: true
